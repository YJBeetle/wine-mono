name: Wine Mono 11.3.0 BTLS and runtime investigation

on:
  push:
    branches: [ codex/wine-mono-11.3.0-btls-regression ]
  workflow_dispatch:
    inputs:
      engine_run:
        description: "Optional successful engine-build run to reuse (blank rebuilds)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        architecture: [x86, x86_64]
        source: [original, pr35]
    env:
      ENGINE_ARCH: ${{ matrix.architecture }}
      ENGINE_SOURCE: ${{ matrix.source }}
      ENGINE_RUN: ${{ github.event_name == 'push' && '38078468319' || inputs.engine_run }}
    steps:
    - uses: actions/checkout@v4
    - name: Check out the isolated 11.3.0 source
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD:mono)" = 04226a35017ea035f09a109a728490055d1493f6
        revision=73610cc7350b7b51dd3bde3323a8ae28eaf5f7fc
        if [ "$ENGINE_SOURCE" = pr35 ]; then
          revision=04226a35017ea035f09a109a728490055d1493f6
        fi
        git submodule init mono
        git config submodule.mono.url https://github.com/YJBeetle/mono.git
        git submodule update --init --depth 1 mono
        git -C mono fetch --depth 1 origin "$revision"
        git -C mono checkout --detach "$revision"
        git -C mono submodule init
        git -C mono config submodule.external/reference-assemblies.url https://github.com/wine-mono/reference-assemblies.git
        git -C mono submodule update --init --recursive --depth 1
        printf 'source=%s\nrevision=%s\narchitecture=%s\n' "$ENGINE_SOURCE" "$revision" "$ENGINE_ARCH" > source-manifest.txt
        git -C mono diff --exit-code
    - name: Install build dependencies
      if: env.ENGINE_RUN == ''
      run: |
        sudo apt-get update
        sudo apt-get install -y autoconf automake libtool-bin gettext cmake build-essential python3 pkg-config
    - name: Build the engine with BTLS enabled
      if: env.ENGINE_RUN == ''
      shell: bash
      run: |
        set -euo pipefail
        make -j2 "libmono-2.0-${ENGINE_ARCH}.dll" 2>&1 | tee engine-build.log
        grep -q '^#define HAVE_BTLS 1' "build/mono-${ENGINE_ARCH}/config.h"
        test -s "image/bin/libmono-2.0-${ENGINE_ARCH}.dll"
        git -C mono diff --exit-code
        sha256sum "image/bin/libmono-2.0-${ENGINE_ARCH}.dll" > engine-sha256.txt
    - name: Download the previously verified engine build
      if: env.ENGINE_RUN != ''
      uses: actions/download-artifact@v4
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        run-id: ${{ env.ENGINE_RUN }}
        name: btls-${{ matrix.source }}-${{ matrix.architecture }}-evidence
        path: engine-cache
    - name: Verify and reuse the immutable engine
      if: env.ENGINE_RUN != ''
      shell: bash
      run: |
        set -euo pipefail
        # Test-only edits may reuse these engines; source and build flags may not.
        git fetch --depth 1 origin 82f527dc0f278077a15e62a80367e079e93c302e
        git diff --exit-code 82f527dc0f278077a15e62a80367e079e93c302e HEAD -- mono.make
        cmp source-manifest.txt engine-cache/source-manifest.txt
        grep -q '^#define HAVE_BTLS 1' "engine-cache/build/mono-${ENGINE_ARCH}/config.h"
        (cd engine-cache && sha256sum -c engine-sha256.txt)
        mkdir -p image/bin
        cp "engine-cache/image/bin/libmono-2.0-${ENGINE_ARCH}.dll" image/bin/
        cp engine-cache/engine-sha256.txt engine-sha256.txt
        printf 'reused-engine-run=%s\n' "$ENGINE_RUN" > reused-engine.txt
    - name: Install test dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends wine wine32:i386 wine64 xvfb xauth mono-mcs openssl
    - name: Inventory implicit native calling conventions
      run: python3 .github/scripts/native-abi-inventory.py mono > native-abi-inventory.txt
    - name: Run BTLS and wider runtime controls
      shell: bash
      run: |
        set -o pipefail
        xvfb-run -a bash .github/scripts/btls-regression.sh "$ENGINE_ARCH" 2>&1 | tee regression-test.log
    - name: Upload complete evidence, including failures
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: btls-${{ matrix.source }}-${{ matrix.architecture }}-evidence
        if-no-files-found: error
        path: |
          engine-build.log
          engine-sha256.txt
          reused-engine.txt
          source-manifest.txt
          native-abi-inventory.txt
          regression-test.log
          build/mono-${{ matrix.architecture }}/config.log
          build/mono-${{ matrix.architecture }}/config.h
          btls-test/*.log
          btls-test/*.txt
          image/bin/libmono-2.0-${{ matrix.architecture }}.dll
