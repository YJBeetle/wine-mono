name: BTLS native Windows Microsoft NET controls

on:
  push:
    branches: [ codex/wine-mono-11.3.0-btls-regression ]
    paths:
      - '.github/workflows/btls-windows-controls.yml'
      - '.github/fixtures/windows-btls/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-net:
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        architecture: [x86, x64]
    steps:
    - uses: actions/checkout@v4
    - name: Prepare the released native DLL and certificate fixtures
      timeout-minutes: 5
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $ProgressPreference = 'SilentlyContinue'
        New-Item -ItemType Directory -Path windows-btls-test, windows-btls-test/runtime | Out-Null
        Write-Host 'Download the released native library package'
        curl.exe -fL --retry 2 --connect-timeout 20 --max-time 120 https://github.com/wine-mono/wine-mono/releases/download/wine-mono-11.3.0/wine-mono-11.3.0-x86.tar.xz -o windows-btls-test/runtime.tar.xz
        if ($LASTEXITCODE -ne 0) { throw 'Runtime download failed' }
        $nativeDir = if ('${{ matrix.architecture }}' -eq 'x86') { 'x86' } else { 'x86_64' }
        Write-Host 'Extract the XZ stream with 7-Zip'
        $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
        & $sevenZip x windows-btls-test/runtime.tar.xz -owindows-btls-test -y
        if ($LASTEXITCODE -ne 0) { throw 'XZ extraction failed' }
        Write-Host 'Extract only the requested native DLL from TAR'
        & $sevenZip e windows-btls-test/runtime.tar "wine-mono-11.3.0/lib/$nativeDir/libmono-btls-shared.dll" -owindows-btls-test -y
        if ($LASTEXITCODE -ne 0 -or !(Test-Path windows-btls-test/libmono-btls-shared.dll)) { throw 'Native extraction failed' }
        Get-FileHash windows-btls-test/libmono-btls-shared.dll -Algorithm SHA256 | Format-List | Out-File windows-btls-test/checksums.txt
        $openssl = 'C:\Program Files\Git\usr\bin\openssl.exe'
        Write-Host 'Generate certificate fixtures'
        & $openssl req -x509 -newkey rsa:2048 -nodes -keyout windows-btls-test/key.pem -out windows-btls-test/certificate.pem -days 1 -subj /CN=WineMonoBtlsProbe
        if ($LASTEXITCODE -ne 0) { throw 'Certificate generation failed' }
        & $openssl x509 -in windows-btls-test/certificate.pem -outform DER -out windows-btls-test/certificate.der
        if ($LASTEXITCODE -ne 0) { throw 'DER conversion failed' }
        # Compatibility fixture for NET Framework; do not depend on Git's
        # optional legacy provider or its MSYS-only default module directory.
        & $openssl pkcs12 -export -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1 -inkey windows-btls-test/key.pem -in windows-btls-test/certificate.pem -out windows-btls-test/certificate.pfx -passout pass:
        if ($LASTEXITCODE -ne 0) { throw 'PFX generation failed' }
        Write-Host 'Compile the probe using Microsoft NET Framework csc'
        $source = (Resolve-Path .github/fixtures/windows-btls/WindowsBtlsProbe.cs).Path
        $output = Join-Path (Resolve-Path windows-btls-test).Path probe.exe
        & C:\Windows\Microsoft.NET\Framework\v4.0.30319\csc.exe /nologo /platform:${{ matrix.architecture }} "/out:$output" $source
        if ($LASTEXITCODE -ne 0) { throw 'Microsoft compiler failed' }
    - name: Run standard APIs and explicit Cdecl; observe default convention separately
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        # No debugger/MDA is forced; the default declaration is an observation,
        # not a requirement to crash or evidence that its ABI is correct.
        $root = (Resolve-Path windows-btls-test).Path
        $der = [Convert]::ToBase64String([IO.File]::ReadAllBytes("$root/certificate.der"))
        $pfx = [Convert]::ToBase64String([IO.File]::ReadAllBytes("$root/certificate.pfx"))
        $failures = 0
        'probe,exit,result' | Out-File "$root/summary.txt"
        foreach ($probe in @('standard-api', 'native-cdecl', 'native-default')) {
          $log = "$root/$probe.log"
          $err = "$root/$probe.stderr.log"
          $process = Start-Process "$root/probe.exe" -ArgumentList @($probe, $der, $pfx) -WorkingDirectory $root -RedirectStandardOutput $log -RedirectStandardError $err -PassThru
          $exit = 'timeout'
          if ($process.WaitForExit(45000)) { $process.Refresh(); $exit = $process.ExitCode }
          else { Stop-Process -Id $process.Id -Force }
          $output = Get-Content $log -Raw
          $result = 'FAIL'
          if ($probe -eq 'native-default') { $result = 'DIAGNOSTIC_OBSERVATION' }
          elseif ($exit -eq 0 -and $output.Contains("PROBE_PASS=$probe")) { $result = 'PASS' }
          else { $failures++ }
          "$probe,$exit,$result" | Add-Content "$root/summary.txt"
          Get-Content $log
          Get-Content $err
        }
        Get-Content "$root/summary.txt"
        if ($failures -ne 0) { throw 'Microsoft NET API or explicit Cdecl regression' }
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: btls-windows-${{ matrix.architecture }}-evidence
        path: |
          windows-btls-test/*.log
          windows-btls-test/*.txt
        if-no-files-found: error
